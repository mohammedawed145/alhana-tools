services:
  - type: web
    name: alhana-tools-api
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: INSTAPAY_ADDRESS
        sync: false
      - key: VODAFONE_CASH_NUMBER
        sync: false
      - key: SHIPPING_FEE
        value: "150"
      - key: RATE_LIMIT_MAX
        value: "300"
